[package]
name = "blobfig-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line tool for inspecting blobfig files"

# Binary is named `blobfig` even though the package is `blobfig-cli`.
[[bin]]
name = "blobfig"
path = "src/main.rs"

[dependencies]
blobfig = { path = ".." }
clap = { version = "4", features = ["derive"] }
