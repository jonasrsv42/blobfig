[workspace]
# The root package (`blobfig`, the library) is itself a workspace member, so
# existing dependents resolving the `blobfig` package are unaffected. CLI-only
# dependencies live in the `blobfig-cli` member, never in the library manifest.
members = [".", "blobfig-cli"]

[package]
name = "blobfig"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.87"
description = "Binary configuration format with zero-copy parsing"

[features]
default = []
ndarray = ["dep:ndarray"]
areamy = ["dep:areamy"]

[dependencies]
parsicomb = { git = "https://github.com/jonasrsv42/parsicomb" }
ndarray = { version = "0.17.2", optional = true }
areamy = { git = "https://github.com/jonasrsv42/areamy", optional = true }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "parse_failure"
harness = false

[[bench]]
name = "array_access"
harness = false
required-features = ["ndarray"]
